trigger:
- master

pool:
  name: lab4-agent-pool

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore
  displayName: Restore

- script: dotnet build --configuration Release
  displayName: Build

- script: dotnet pack StringExtensionsLibrary/StringExtensionsLibrary.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)
  displayName: Pack NuGet

- task: NuGetAuthenticate@1
  displayName: Authenticate to Azure Artifacts

- task: NuGetCommand@2
  displayName: Push NuGet package
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg;!$(Build.ArtifactStagingDirectory)/*.symbols.nupkg'
    publishVstsFeed: 'Lab4-Artifacts/lab4-feed'
    allowPackageConflicts: true