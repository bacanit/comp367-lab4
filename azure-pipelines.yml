trigger:
- master

pool:
  name: lab4-agent-pool

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet restore
  displayName: Restore

- script: dotnet build --configuration Release
  displayName: Build

- script: dotnet pack StringExtensionsLibrary/StringExtensionsLibrary.csproj -c Release -o $(Build.ArtifactStagingDirectory)
  displayName: Pack NuGet

- task: NuGetAuthenticate@1

- script: dotnet nuget push "$(Build.ArtifactStagingDirectory)\*.nupkg" --source "https://pkgs.dev.azure.com/tbacani/Lab4-Artifacts/_packaging/lab4-feed/nuget/v3/index.json" --api-key AzureArtifacts
  displayName: Push NuGet package